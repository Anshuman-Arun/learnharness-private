name: Private Windows baseline checks
on:
  push:
    branches: [feature/private-windows-baseline]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:win
      - run: npm run lint
      - run: npm run build
      - run: node scripts/build-server.mjs
      - run: node scripts/smoke-server.mjs --electron
