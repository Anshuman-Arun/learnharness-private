name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Typecheck, tests, lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint

  standalone:
    name: Standalone (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Standard macos-15 runners are Apple Silicon (not macos-15-intel).
          - os: macos-15
            platform: mac-arm64
          - os: windows-2025
            platform: windows-x64
          - os: ubuntu-24.04
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - name: Native renderer tests on this OS
        run: npx electron --import tsx --test tests/pdf-native-render.test.ts tests/pdf-ops.test.ts tests/svg-native-render.test.ts tests/browser-service.test.ts
        env:
          NODE_ENV: test
          ELECTRON_RUN_AS_NODE: "1"
      - run: npm run build
      - run: node scripts/build-server.mjs
      - run: node scripts/smoke-server.mjs --electron
      - name: Browser QA — original global learning DAG
        if: matrix.platform == 'linux-x64'
        run: node scripts/global-learning-visual-qa.mjs
      - name: Browser QA — larger four-field graph using real Dagre
        if: matrix.platform == 'linux-x64'
        run: node scripts/global-learning-large-visual-qa.mjs
      - name: Upload larger graph screenshots
        if: matrix.platform == 'linux-x64' && always()
        uses: actions/upload-artifact@v7
        with:
          name: global-learning-four-fields-visual-qa
          path: artifacts/global-learning-large
          if-no-files-found: ignore
      - name: Upload global DAG screenshots
        if: matrix.platform == 'linux-x64' && always()
        uses: actions/upload-artifact@v7
        with:
          name: global-learning-browser-screenshots
          path: artifacts/global-learning-ui
          if-no-files-found: ignore
