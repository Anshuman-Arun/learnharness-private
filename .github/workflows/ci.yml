name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Typecheck, tests, lint
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      # npm scripts use cmd.exe by default on Windows. Use the runner's
      # Git Bash so the test script's NODE_ENV assignment stays portable.
      npm_config_script_shell: 'C:\Program Files\Git\bin\bash.exe'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Isolate hanging or failing regression test files
        run: node scripts/diagnose-test-files.mjs
      - run: npm test
      - run: npm run lint

  standalone:
    name: Standalone (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - name: Native renderer tests on this OS
        run: npx electron --import tsx --test tests/pdf-native-render.test.ts tests/pdf-ops.test.ts tests/svg-native-render.test.ts tests/browser-service.test.ts
        env:
          NODE_ENV: test
          ELECTRON_RUN_AS_NODE: "1"
      - run: npm run build
      - run: node scripts/build-server.mjs
      - run: node scripts/smoke-server.mjs --electron
      - name: Browser QA — original global learning DAG
        run: node scripts/global-learning-visual-qa.mjs
      - name: Browser QA — larger four-field graph using real Dagre
        run: node scripts/global-learning-large-visual-qa.mjs
      - name: Upload larger graph screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: global-learning-four-fields-visual-qa
          path: artifacts/global-learning-large
          if-no-files-found: ignore
      - name: Upload global DAG screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: global-learning-browser-screenshots
          path: artifacts/global-learning-ui
          if-no-files-found: ignore

  editorial-visual:
    name: Editorial graph / theme visual smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/build-server.mjs
      - name: Launch real Next UI in Chrome with synthetic graph fixtures
        run: node scripts/editorial-visual-qa.mjs
      - name: Audit real pages, typography, brand color, settings and lesson UI
        run: node scripts/editorial-page-audit.mjs
      - name: Upload complete editorial page audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: editorial-complete-page-audit
          path: artifacts/editorial-pages/*.png
          if-no-files-found: warn
      - name: Retain dark/light screenshots for inspection
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: editorial-graph-visual-qa
          path: artifacts/editorial-ui/*.png
          if-no-files-found: warn
