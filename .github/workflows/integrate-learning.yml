name: Publish tested LearnHarness integration
on:
  push:
    branches: [integration/learning-features-nov2026]
    paths: [.github/workflows/integrate-learning.yml]
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: integrated-source
          run-id: 44868831196
          github-token: ${{ github.token }}
      - name: Publish pretested integration bundle
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git clone --quiet -b integrated integrated.bundle published
          cd published
          git remote remove origin
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git fetch --no-tags origin integration/learning-features-nov2026
          git config user.name "LearnHarness integration"
          git config user.email "integration@users.noreply.github.com"
          git reset --soft origin/integration/learning-features-nov2026
          git rm -r -f .github/workflows
          git checkout origin/integration/learning-features-nov2026 -- .github/workflows
          git add -A
          git commit -m "Import tested LearnHarness upstream with compatible feature PRs"
          git diff --exit-code origin/integration/learning-features-nov2026 HEAD -- .github/workflows
          git push origin HEAD:refs/heads/integration/learning-features-nov2026
