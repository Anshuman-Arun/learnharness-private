name: Publish tested LearnHarness integration
on:
  push:
    branches: [integration/learning-features-nov2026]
    paths: [.github/workflows/integrate-learning.yml]
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: integrated-source
          run-id: 44868831196
          github-token: ${{ github.token }}
      - name: Publish pretested integration bundle
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git clone --quiet -b integrated integrated.bundle published
          cd published
          git remote remove origin
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config http.https://github.com/.extraheader "AUTHORIZATION: bearer $GH_TOKEN"
          git push --force-with-lease="refs/heads/integration/learning-features-nov2026:$EXPECTED_SHA" origin HEAD:refs/heads/integration/learning-features-nov2026
